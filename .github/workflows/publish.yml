name: Publish to PyPI

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI trusted publishing (OIDC — no API token needed)

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Check if version is already on PyPI
        id: version_check
        run: |
          PKG_VERSION=$(uvx hatch version)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/agent-skills-bundle/${PKG_VERSION}/json")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Version $PKG_VERSION already on PyPI — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version $PKG_VERSION is new — will publish."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.version_check.outputs.skip == 'false'
        run: uv build

      - name: Publish
        if: steps.version_check.outputs.skip == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
