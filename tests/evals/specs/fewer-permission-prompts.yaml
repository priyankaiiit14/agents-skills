skill: fewer-permission-prompts
input: |
  I keep getting permission prompts for these commands:
  - git status
  - git diff
  - git log --oneline -20
  - cat README.md
  - ls -la

  Please add allow rules for these.
rubric: |
  - The response proposes allow rules that cover git status, git diff, git log, cat, and ls.
  - The rules use the correct format: Bash(command *) or a close equivalent.
  - The response does NOT add allow rules for destructive commands (rm, git push, git reset, etc.).
  - The response shows the proposed diff or asks which settings file to target (project vs global) before writing.
