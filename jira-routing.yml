requested_tickets:
  # Use [] for "nothing to add yet". Replace [] with indented list items when
  # you have rough notes, for example:
  # scope:
  #   - load configs from databricks
  #   - add unit tests
  #
  # Rough notes are fine. The agent should correct spelling/grammar, clarify
  # wording, infer useful context, and show a polished draft before creation.
  # Dependency fields are for Jira linked work items/subtasks, not description
  # text. Leave [] when there are no linked issues; the agent should not render
  # "Dependencies: None" in Jira.
  - route: stackforge
    jira_key: DSML-5245
    jira_url: https://cnissues.atlassian.net/browse/DSML-5245
    creation_status: created
    issue_type: Story
    summary: StackForge MCP Authentication
    priority: Medium
    context: The StackForge MCP endpoint is currently public. Anyone with access to the endpoint can reach it, which creates a security risk because Conde Nast data may be exposed without authentication or authorization controls.
    scope:
      - Add authentication and authorization controls for the StackForge MCP endpoint.
      - Restrict access so only approved users or services can call the MCP.
      - Ensure unauthenticated requests are rejected without exposing sensitive data.
    acceptance_criteria:
      - Given an unauthenticated request, when the request reaches the StackForge MCP endpoint, then access is denied.
      - Given an authenticated and authorized request, when the request reaches the StackForge MCP endpoint, then the request is allowed.
      - Given a failed authentication or authorization attempt, when the response is returned, then no sensitive Conde Nast data is exposed.
    technical_notes:
      - Confirm the expected authentication mechanism before implementation.
      - Add logging or monitoring for denied access attempts if supported by the MCP deployment.
    dependencies:
      blocks: []
      blocked_by: []
      parent_of: []
      child_of: []
    links: []

  - route: segmentation
    jira_key: DSML-5246
    jira_url: https://cnissues.atlassian.net/browse/DSML-5246
    creation_status: created
    issue_type: Task
    summary: Add DDA Job Dependency on IDR Data Availability
    priority: Medium
    context: The DDA job can run even when the upstream IDR job has failed or is delayed. When that happens, DDA may process partial or missing IDR data for the day, causing users to be missed.
    scope:
      - Add dependency handling so DDA waits for the required IDR data before running.
      - Use the idr_map_expand table as the data availability check.
      - Add Slack job alerts when the required IDR data is missing or delayed.
      - Configure the dependency in Airflow so the DDA run does not proceed with incomplete IDR input.
    acceptance_criteria:
      - Given the IDR job has not completed successfully, when the DDA job is scheduled, then the DDA job does not run with missing or incomplete IDR data.
      - Given idr_map_expand does not contain the expected data for the run date, when the dependency check runs, then a Slack alert is sent.
      - Given the required IDR data is available, when the Airflow dependency check runs, then the DDA job proceeds normally.
    technical_notes:
      - Validate the expected readiness condition on idr_map_expand.
      - Implement or update the Airflow dependency before the DDA job starts.
      - Configure Slack alerts for dependency failures or delayed upstream data.
    dependencies:
      blocks: []
      blocked_by: []
      parent_of: []
      child_of: []
    links: []

  - route: search
    jira_key: DSML-5247
    jira_url: https://cnissues.atlassian.net/browse/DSML-5247
    creation_status: created
    issue_type: Story
    summary: Jarvis | Pre-filtering
    priority: Medium
    user_story: As a Runway search user, I want selected filters to be applied before candidate retrieval, so that Jarvis returns a more relevant candidate set and avoids losing good matches during post-filtering.
    context: Jarvis currently searches across approximately 1.1M Runway images for open-text queries, returns a candidate set of around 5,000 results, and then applies filters after retrieval. This post-filtering approach can reduce recall because relevant items may never make it into the returned candidate set.
    acceptance_criteria:
      - Given a user applies filters with an open-text query, when Jarvis retrieves candidates, then the filters are applied before or during candidate retrieval rather than only after retrieval.
      - Given the filtered candidate space contains relevant Runway images, when the query runs, then those relevant images are eligible to appear in the returned results.
      - Given pre-filtering is enabled, when results are compared against the current post-filtering behavior, then recall is improved or the tradeoff is documented with measurable results.
    technical_notes:
      - Evaluate how filters should constrain the Runway image candidate set before retrieval.
      - Compare pre-filtering behavior against the existing post-filtering flow.
    dependencies:
      blocks: []
      blocked_by: []
      parent_of: []
      child_of: []
    links:
      - title: Jarvis pre-filtering design doc
        url: https://docs.google.com/document/d/1pX583smFMHVDFkz9uWP1--wFwtw2MhaL5pO_SFK8KOA/edit?tab=t.0#heading=h.ayxh9w9ntgmi
