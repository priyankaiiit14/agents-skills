[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-skills-bundle"
version = "0.1.0"
description = "Packaged Claude Code / Codex skills for teams"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["claude", "codex", "skills", "agents", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
agent-skills-bundle = "agent_skills_bundle.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_skills_bundle"]

