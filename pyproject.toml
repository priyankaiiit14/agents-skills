[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-skills-bundle"
version = "0.1.0"
description = "Packaged Claude Code / Codex skills for teams"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["claude", "codex", "skills", "agents", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
# Layer A — deterministic static + CLI gate (fast, free, runs in CI).
dev = ["pytest>=7", "pyyaml>=6"]
# Layer B — behavioral evals: an agent run + LLM-as-judge (needs an API key, costs tokens).
evals = ["pytest>=7", "openai>=1.0", "pyyaml>=6"]

[project.scripts]
agent-skills-bundle = "agent_skills_bundle.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_skills_bundle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "eval: behavioral eval that calls the model (opt-in; needs RUN_EVALS=1 and OPENAI_API_KEY)",
]

